<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>ORCHIS MX-7</title>
<style>
  :root { --ink: #1d1c22; --mute: #7a7882; --line: #d9d7de; --mag: #e0168f; --paper: #efeef1; }
  html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; background: var(--paper); font-family: "Microsoft YaHei", "PingFang SC", sans-serif; color: var(--ink); }
  canvas { position: absolute; inset: 0; display: block; }
  .ui { position: absolute; inset: 0; pointer-events: none; }
  .brand { position: absolute; left: 36px; top: 28px; }
  .brand .n { font-size: 26px; font-weight: 700; letter-spacing: 0.08em; }
  .brand .n b { color: var(--mag); font-weight: 700; }
  .brand .s { font-size: 13px; color: var(--mute); margin-top: 4px; letter-spacing: 0.04em; }
  .buttons { position: absolute; left: 50%; bottom: 26px; transform: translateX(-50%); display: flex; gap: 12px; }
  .btn { position: relative; padding: 9px 20px; border-radius: 999px; border: 1.5px solid var(--line); background: rgba(255,255,255,0.82); font-size: 14px; letter-spacing: 0.04em; overflow: hidden; }
  .btn .bar { position: absolute; left: 0; bottom: 0; height: 2px; background: var(--mag); width: 0; }
  .btn.on { border-color: var(--mag); color: var(--mag); background: #fff; }
  .cards { position: absolute; right: 28px; top: 92px; width: 214px; display: flex; flex-direction: column; gap: 10px; }
  .card { background: rgba(255,255,255,0.86); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; transition: none; }
  .card.on { border-color: var(--mag); box-shadow: 0 0 0 1px var(--mag) inset; }
  .card .t { font-size: 12px; font-weight: 700; letter-spacing: 0.06em; margin-bottom: 6px; }
  .card.on .t { color: var(--mag); }
  .row { display: flex; justify-content: space-between; font-size: 12px; line-height: 20px; color: var(--mute); }
  .row span:last-child { color: var(--ink); font-variant-numeric: tabular-nums; }
  .tc { position: absolute; left: 36px; bottom: 30px; font-size: 12px; color: var(--mute); font-variant-numeric: tabular-nums; letter-spacing: 0.05em; }
  .act { position: absolute; left: 36px; top: 96px; font-size: 13px; letter-spacing: 0.1em; color: var(--mag); }
</style>
<script type="importmap">
{ "imports": {
  "three": "../node_modules/three/build/three.module.js",
  "three/addons/": "../node_modules/three/examples/jsm/"
} }
</script>
</head>
<body>
<div class="ui">
  <div class="brand"><div class="n" id="pname"></div><div class="s" id="psub"></div></div>
  <div class="act" id="act"></div>
  <div class="cards" id="cards"></div>
  <div class="buttons" id="buttons"></div>
  <div class="tc" id="tc"></div>
</div>
<script type="module" src="./film.js"></script>
</body>
</html>
