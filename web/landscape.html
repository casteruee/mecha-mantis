<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ORCHIS MX-7 · landscape</title>
<style>
  :root { --ink: #16151a; --mute: #8a8892; --line: #e2e0e6; --mag: #e0168f; --paper: #f3f2f5; }
  html, body { margin: 0; overflow: hidden; background: var(--paper); font-family: "Inter", "Segoe UI", Arial, sans-serif; color: var(--ink); }
  canvas { position: absolute; left: 0; top: 0; display: block; }
  /* the UI is laid out on the 1920×1080 stage and scaled to the render size */
  .ui { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; pointer-events: none; }
  .ui.hide { display: none; }

  /* faint orbit rings + dots in the background */
  .rings { position: absolute; inset: 0; overflow: hidden; }
  .rings svg { position: absolute; left: 50%; top: 54%; transform: translate(-50%, -50%); }

  /* brand + live tag */
  .brand { position: absolute; left: 56px; top: 34px; display: flex; align-items: center; gap: 14px; font-size: 26px; font-weight: 800; }
  .brand .ic { width: 44px; height: 44px; border-radius: 12px; background: var(--mag); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 24px; }
  .live { position: absolute; right: 56px; top: 38px; display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 600;
          background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 10px 20px; }
  .live .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--mag); }

  /* title block + button pills */
  .head { position: absolute; left: 0; right: 0; top: 30px; text-align: center; }
  .head .p { font-size: 23px; font-weight: 700; letter-spacing: 0.02em; }
  .head .p b { color: var(--mag); }
  .head .t { font-size: 41px; font-weight: 800; margin-top: 4px; letter-spacing: -0.01em; }
  .head .u { width: 54px; height: 4px; border-radius: 2px; background: var(--mag); margin: 10px auto 0; }
  .head .d { font-size: 14px; color: var(--mute); margin-top: 7px; }
  .pills { display: flex; justify-content: center; gap: 12px; margin-top: 12px; }
  .pill { display: flex; align-items: center; gap: 8px; background: #fff; border: 1.5px solid var(--line); border-radius: 999px;
          padding: 9px 20px; font-size: 16px; font-weight: 600; color: var(--ink); }
  .pill .tri { width: 0; height: 0; border-left: 9px solid var(--mag); border-top: 6px solid transparent; border-bottom: 6px solid transparent; }
  .pill.on { border-color: var(--mag); box-shadow: 0 0 0 3px rgba(224, 22, 143, 0.18); }

  /* right cards */
  .cards { position: absolute; right: 48px; top: 208px; width: 300px; display: flex; flex-direction: column; gap: 18px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px 14px; }
  .card .ct { font-size: 12px; letter-spacing: 0.12em; color: var(--mute); font-weight: 700; }
  .card .cv { font-size: 34px; font-weight: 800; margin-top: 2px; }
  .card .cv small { font-size: 15px; font-weight: 600; color: var(--mute); margin-left: 4px; }
  .card .w { margin-top: 10px; height: 26px; }
  .card .w svg { display: block; width: 100%; height: 100%; }
  .card .seg { display: flex; gap: 5px; margin-top: 12px; }
  .card .seg i { flex: 1; height: 22px; border-radius: 4px; background: var(--line); }
  .card .seg i.on { background: var(--mag); }
  .card .prog { margin-top: 14px; height: 6px; border-radius: 3px; background: var(--line); position: relative; }
  .card .prog i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: var(--mag); }
  .card .batt { margin-top: 12px; height: 22px; border: 2px solid var(--line); border-radius: 6px; position: relative; padding: 2px; }
  .card .batt::after { content: ""; position: absolute; right: -8px; top: 5px; width: 5px; height: 8px; background: var(--line); border-radius: 0 2px 2px 0; }
  .card .batt i { display: block; height: 100%; border-radius: 3px; background: var(--mag); }

  /* status + timecode */
  .status { position: absolute; left: 64px; right: 380px; bottom: 34px; display: flex; align-items: center; gap: 16px; font-size: 18px; }
  .status .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--mag); flex: none; }
  .status .txt { flex: none; min-width: 250px; font-weight: 600; }
  .status .bar { flex: 1; height: 3px; background: var(--line); border-radius: 2px; position: relative; }
  .status .bar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--mag); border-radius: 2px; }
  .tc { position: absolute; right: 64px; bottom: 34px; color: var(--mute); font-size: 18px; font-variant-numeric: tabular-nums; }

  /* lead-line labels */
  .labels { position: absolute; inset: 0; }
  .labels svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .lab { position: absolute; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px;
         box-shadow: 0 4px 14px rgba(20, 18, 28, 0.08); }
  .lab .lt { font-size: 15px; font-weight: 700; }
  .lab .ls { font-size: 12px; color: var(--mute); margin-top: 1px; }

  /* cursor */
  .cursor { position: absolute; width: 30px; height: 30px; }

  /* fade veil */
  .veil { position: absolute; inset: 0; background: #fff; opacity: 0; }

  /* HUD corner viewfinder brackets (teardown act) */
  .hud { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; }
</style>
<script type="importmap">
{ "imports": {
  "three": "../node_modules/three/build/three.module.js",
  "three/addons/": "../node_modules/three/examples/jsm/"
} }
</script>
</head>
<body>
<div class="ui" id="ui">
  <div class="rings" id="rings"></div>
  <div class="brand"><div class="ic">C</div><span id="brandname"></span></div>
  <div class="live"><div class="dot"></div>Live sim</div>
  <div class="head">
    <div class="p" id="pname"></div><div class="t" id="ptitle"></div><div class="u"></div><div class="d" id="pdate"></div>
    <div class="pills" id="pills"></div>
  </div>
  <div class="cards" id="cards"></div>
  <div class="labels" id="labels"><svg id="leaders"></svg></div>
  <div class="status"><div class="dot"></div><div class="txt" id="stxt"></div><div class="bar"><i id="sbar"></i></div></div>
  <div class="tc" id="tc"></div>
  <svg class="cursor" id="cursor" viewBox="0 0 24 24"><path d="M4 2 L4 20 L9 15 L12.5 22 L16 20 L12.5 13.5 L19 13 Z" fill="#16151a" stroke="#fff" stroke-width="1.4"/></svg>
  <svg class="hud" id="hud" viewBox="0 0 1920 1080">
    <g fill="none" stroke="#e0168f" stroke-width="3.2" opacity="0.85">
      <path d="M 52 122 L 52 52 L 122 52"/><path d="M 1868 122 L 1868 52 L 1798 52"/>
      <path d="M 52 958 L 52 1028 L 122 1028"/><path d="M 1868 958 L 1868 1028 L 1798 1028"/>
    </g>
    <g fill="#e0168f" opacity="0.7">
      <rect x="954" y="46" width="12" height="3"/><rect x="954" y="1031" width="12" height="3"/>
      <rect x="46" y="534" width="3" height="12"/><rect x="1871" y="534" width="3" height="12"/>
    </g>
  </svg>
  <div class="veil" id="veil"></div>
</div>
<script type="module" src="./landscape.js"></script>
</body>
</html>
