<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ORCHIS MX-7 · vertical</title>
<style>
  :root { --ink: #16151a; --mute: #8a8892; --line: #e2e0e6; --mag: #e0168f; --paper: #f3f2f5; }
  html, body { margin: 0; overflow: hidden; background: var(--paper); font-family: "Inter", "Segoe UI", Arial, sans-serif; color: var(--ink); }
  canvas { position: absolute; left: 0; top: 0; display: block; }
  /* the UI is laid out on the 1080×1920 stage and scaled to the render size */
  .ui { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 0 0; pointer-events: none; }
  .ui.hide { display: none; }
  .head { position: absolute; left: 0; right: 0; top: 170px; text-align: center; }
  .head .p { font-size: 34px; font-weight: 700; letter-spacing: 0.02em; }
  .head .p b { color: var(--mag); }
  .head .t { font-size: 58px; font-weight: 800; margin-top: 8px; letter-spacing: -0.01em; }
  .head .u { width: 70px; height: 5px; border-radius: 3px; background: var(--mag); margin: 18px auto 0; }
  .status { position: absolute; left: 70px; right: 150px; top: 1490px; display: flex; align-items: center; gap: 18px; font-size: 24px; }
  .status .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--mag); flex: none; }
  .status .txt { flex: none; min-width: 330px; font-weight: 600; }
  .status .bar { flex: 1; height: 4px; background: var(--line); border-radius: 2px; position: relative; }
  .status .bar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--mag); border-radius: 2px; }
  .status .tc { flex: none; color: var(--mute); font-variant-numeric: tabular-nums; }
</style>
<script type="importmap">
{ "imports": {
  "three": "../node_modules/three/build/three.module.js",
  "three/addons/": "../node_modules/three/examples/jsm/"
} }
</script>
</head>
<body>
<div class="ui" id="ui">
  <div class="head"><div class="p" id="pname"></div><div class="t" id="ptitle"></div><div class="u"></div></div>
  <div class="status"><div class="dot"></div><div class="txt" id="stxt"></div><div class="bar"><i id="sbar"></i></div><div class="tc" id="tc"></div></div>
</div>
<script type="module" src="./vertical.js"></script>
</body>
</html>
